name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nginx_ref:
        description: nginx-ext branch, tag or commit
        default: '1.31.8'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'HanadaLee/ngx_http_limit_traffic_rate_filter_module'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module_mode: [static, dynamic]
        expr: [enabled, disabled]
    steps:
      - name: Check out module
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out nginx-ext
        uses: actions/checkout@v6
        with:
          repository: HanadaLee/nginx-ext
          ref: ${{ inputs.nginx_ref || '1.31.8' }}
          path: .ci/nginx
          persist-credentials: false

      - name: Check out nginx-tests
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx-tests
          path: .ci/nginx-tests
          persist-credentials: false

      - name: Check out expr
        if: matrix.expr == 'enabled'
        uses: actions/checkout@v6
        with:
          repository: HanadaLee/ngx_expr_module
          ref: '1.0.0'
          path: .ci/ngx_expr_module
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            perl \
            curl \
            netcat-openbsd \
            procps \
            python3 \
            pkg-config

      - name: Build and test
        env:
          TEST_MODULE_MODE: ${{ matrix.module_mode }}
          TEST_EXPR: ${{ matrix.expr }}
        run: bash util/run-tests.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.module_mode }}-expr-${{ matrix.expr }}
          path: |
            .ci/test-output/**/*.log
            .ci/test-output/run.log
            t/servroot/logs/
            servroot/logs/
            /tmp/ngx-*-*/logs/*.log
          if-no-files-found: ignore
